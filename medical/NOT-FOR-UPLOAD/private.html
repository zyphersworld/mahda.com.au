/* ==========================================================================
   liveries.css — six-livery system, same tokens as mahda.com.au / gasc / ekklesia
   Default here is VELLUM (light, high contrast) because this page gets read
   by clinicians on phones under bright ED lighting. Iron is still available.
   ========================================================================== */

:root {
  --font-display: "Cinzel", Georgia, serif;
  --font-body: "IM Fell English", Georgia, serif;
  --font-black: "UnifrakturMaguntia", "Cinzel", serif;
  --font-data: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;

  --rad: 2px;
  --maxw: 60rem;
  --gap: 1.25rem;
  --transition: 320ms cubic-bezier(.4, 0, .2, 1);
}

/* ---------- VELLUM — parchment, ink, rubric red (DEFAULT) ---------- */
[data-livery="vellum"] {
  --bg:          #efe7d6;
  --bg-2:        #e4d9c2;
  --panel:       #f7f1e3;
  --panel-2:     #ece2cd;
  --ink:         #241d15;
  --ink-2:       #4d4335;
  --ink-3:       #6e6350;
  --rule:        #bfae8c;
  --accent:      #9a2f28;
  --accent-2:    #c4562c;
  --accent-ink:  #fdf8ee;
  --alert:       #8c1f16;
  --ok:          #3f6136;
  --grain:       rgba(90, 70, 40, .05);
  --shadow:      0 1px 0 rgba(255,255,255,.6), 0 10px 26px rgba(60,45,20,.14);
}

/* ---------- IRON — steel night, cold gold ---------- */
[data-livery="iron"] {
  --bg:          #14171a;
  --bg-2:        #0d0f11;
  --panel:       #1e2226;
  --panel-2:     #262b30;
  --ink:         #e7e3da;
  --ink-2:       #b3ada1;
  --ink-3:       #8b857a;
  --rule:        #3a4148;
  --accent:      #c9a227;
  --accent-2:    #e0be4a;
  --accent-ink:  #14171a;
  --alert:       #d4553f;
  --ok:          #6f9f5e;
  --grain:       rgba(255, 255, 255, .028);
  --shadow:      0 1px 0 rgba(255,255,255,.05), 0 12px 30px rgba(0,0,0,.5);
}

/* ---------- BRASS — warm metal, lamp light ---------- */
[data-livery="brass"] {
  --bg:          #241c12;
  --bg-2:        #191309;
  --panel:       #322718;
  --panel-2:     #3d301e;
  --ink:         #f0e2c6;
  --ink-2:       #c8b492;
  --ink-3:       #9c8a6c;
  --rule:        #5c4a2d;
  --accent:      #d9a441;
  --accent-2:    #f0c66b;
  --accent-ink:  #241c12;
  --alert:       #e0693f;
  --ok:          #86a55e;
  --grain:       rgba(255, 226, 170, .035);
  --shadow:      0 1px 0 rgba(255,225,170,.06), 0 12px 30px rgba(0,0,0,.5);
}

/* ---------- EMERALD — moss, bog oak, knotwork green ---------- */
[data-livery="emerald"] {
  --bg:          #101a15;
  --bg-2:        #0a110d;
  --panel:       #17251d;
  --panel-2:     #1e2f25;
  --ink:         #e2ecdf;
  --ink-2:       #a9bda4;
  --ink-3:       #7e9179;
  --rule:        #32483a;
  --accent:      #4fae7a;
  --accent-2:    #7fd2a2;
  --accent-ink:  #08120c;
  --alert:       #d4713f;
  --ok:          #6bc98d;
  --grain:       rgba(200, 255, 220, .03);
  --shadow:      0 1px 0 rgba(190,255,215,.05), 0 12px 30px rgba(0,0,0,.5);
}

/* ---------- SANCTUM — chapel stone, candle, blue glass ---------- */
[data-livery="sanctum"] {
  --bg:          #12151f;
  --bg-2:        #0b0d15;
  --panel:       #1b2030;
  --panel-2:     #232a3d;
  --ink:         #e6e8f2;
  --ink-2:       #adb3c8;
  --ink-3:       #838aa2;
  --rule:        #343c55;
  --accent:      #8f9fe0;
  --accent-2:    #b9c4f2;
  --accent-ink:  #0b0d15;
  --alert:       #e07a6a;
  --ok:          #7bbd9b;
  --grain:       rgba(220, 228, 255, .03);
  --shadow:      0 1px 0 rgba(210,220,255,.05), 0 12px 30px rgba(0,0,0,.55);
}

/* ---------- SIGIL — vellum gone dark, sigil violet ---------- */
[data-livery="sigil"] {
  --bg:          #191320;
  --bg-2:        #100b16;
  --panel:       #241b2e;
  --panel-2:     #2e2339;
  --ink:         #ece4f2;
  --ink-2:       #bcaec9;
  --ink-3:       #93869f;
  --rule:        #453553;
  --accent:      #b57ae0;
  --accent-2:    #d3a8f0;
  --accent-ink:  #120c17;
  --alert:       #e0705f;
  --ok:          #7cbf9a;
  --grain:       rgba(235, 210, 255, .035);
  --shadow:      0 1px 0 rgba(230,205,255,.05), 0 12px 30px rgba(0,0,0,.55);
}

/* ---------- CLINICAL — not a livery dot. Toggled by the "Clinical view"
     button. Strips ornament to maximum-contrast black on white for
     handing the phone to a stranger, or for printing. ---------- */
[data-clinical="on"] {
  --bg:          #ffffff;
  --bg-2:        #ffffff;
  --panel:       #ffffff;
  --panel-2:     #f4f4f4;
  --ink:         #000000;
  --ink-2:       #1f1f1f;
  --ink-3:       #444444;
  --rule:        #9a9a9a;
  --accent:      #a00000;
  --accent-2:    #a00000;
  --accent-ink:  #ffffff;
  --alert:       #a00000;
  --ok:          #14571f;
  --grain:       transparent;
  --shadow:      none;
  --font-display: "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-body:   "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-black:  "Helvetica Neue", Arial, system-ui, sans-serif;
}

/* ==========================================================================
   main.css — Medical Handover, mahda.com.au subfolder system
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.62;
  transition: background var(--transition), color var(--transition);
}

body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    repeating-linear-gradient(55deg, var(--grain) 0 1px, transparent 1px 3px);
}

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 1.15rem; position: relative; z-index: 1; }

a { color: var(--accent); text-underline-offset: .18em; }
a:hover { color: var(--accent-2); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ---------------- masthead ---------------- */
.masthead {
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
  position: relative; z-index: 1;
}
.masthead .wrap { padding-top: 1.1rem; padding-bottom: .85rem; }

.brand { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
.brand-mark {
  font-family: var(--font-black);
  font-size: 1.9rem; line-height: 1; color: var(--accent);
}
.brand-name {
  font-family: var(--font-display);
  font-size: 1.18rem; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; margin: 0;
}
.brand-sub {
  font-family: var(--font-data);
  font-size: .7rem; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
}

.mast-tools { display: flex; align-items: center; gap: .55rem; margin-top: .85rem; flex-wrap: wrap; }

.liveries { display: flex; gap: .38rem; }
.livery-dot {
  width: 1.05rem; height: 1.05rem; border-radius: 50%;
  border: 1px solid var(--rule); cursor: pointer; padding: 0;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.livery-dot:hover { transform: scale(1.18); }
.livery-dot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
.dot-vellum  { background: #efe7d6; }
.dot-iron    { background: #2b3238; }
.dot-brass   { background: #d9a441; }
.dot-emerald { background: #4fae7a; }
.dot-sanctum { background: #8f9fe0; }
.dot-sigil   { background: #b57ae0; }

.btn {
  font-family: var(--font-data);
  font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
  padding: .48rem .8rem; border-radius: var(--rad); cursor: pointer;
  border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink-2);
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
}
.btn:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------------- nav ---------------- */
.nav {
  border-bottom: 1px solid var(--rule);
  background: var(--bg-2);
  position: sticky; top: 0; z-index: 20;
}
.nav .wrap { display: flex; gap: .15rem; overflow-x: auto; padding-top: .3rem; padding-bottom: .3rem; scrollbar-width: thin; }
.nav a {
  font-family: var(--font-display);
  font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
  padding: .58rem .78rem; white-space: nowrap; text-decoration: none;
  color: var(--ink-3); border-bottom: 2px solid transparent;
}
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------------- page furniture ---------------- */
main { padding: 1.6rem 0 3.5rem; }

.page-head { margin: 0 0 1.4rem; }
.eyebrow {
  font-family: var(--font-data);
  font-size: .68rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); margin: 0 0 .4rem;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 5vw, 2.35rem); line-height: 1.14;
  margin: 0 0 .5rem; letter-spacing: .01em;
}
h2 {
  font-family: var(--font-display);
  font-size: 1.18rem; letter-spacing: .04em; text-transform: uppercase;
  margin: 0 0 .7rem; color: var(--ink);
}
h3 { font-family: var(--font-display); font-size: 1rem; letter-spacing: .03em; margin: 0 0 .4rem; }
.lede { font-size: 1.13rem; color: var(--ink-2); margin: 0 0 1rem; }
p { margin: 0 0 .85rem; }
ul, ol { margin: 0 0 .9rem; padding-left: 1.15rem; }
li { margin-bottom: .35rem; }

/* ---------------- panels ---------------- */
.panel {
  position: relative;
  background: linear-gradient(150deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 1px solid var(--rule);
  border-radius: var(--rad);
  padding: 1.15rem 1.2rem;
  margin: 0 0 1.15rem;
  box-shadow: var(--shadow);
}
.panel::before, .panel::after {
  content: ""; position: absolute; width: 12px; height: 12px;
  border: 1px solid var(--accent); opacity: .65; pointer-events: none;
}
.panel::before { top: 5px; left: 5px; border-right: 0; border-bottom: 0; }
.panel::after  { bottom: 5px; right: 5px; border-left: 0; border-top: 0; }

.panel > :last-child { margin-bottom: 0; }

/* alert panel — the "read this first" block */
.panel.alert {
  border-color: var(--alert);
  border-left-width: 5px;
}
.panel.alert::before, .panel.alert::after { border-color: var(--alert); }
.panel.alert h2 { color: var(--alert); }

.panel.quiet { background: var(--bg-2); box-shadow: none; }
.panel.quiet::before, .panel.quiet::after { display: none; }

/* ---------------- data rows ---------------- */
.rows { border-top: 1px solid var(--rule); margin: .3rem 0 .9rem; }
.row {
  display: grid; grid-template-columns: 11.5rem 1fr; gap: .3rem 1rem;
  padding: .6rem 0; border-bottom: 1px solid var(--rule);
}
.row dt, .row .k {
  font-family: var(--font-data);
  font-size: .69rem; letter-spacing: .11em; text-transform: uppercase;
  color: var(--ink-3); margin: 0; padding-top: .18rem;
}
.row dd, .row .v { margin: 0; color: var(--ink); }
@media (max-width: 34rem) { .row { grid-template-columns: 1fr; gap: .1rem; } }

/* ---------------- timeline ---------------- */
.tl { list-style: none; margin: .2rem 0 0; padding: 0; }
.tl li {
  position: relative; padding: 0 0 1.05rem 1.5rem;
  border-left: 1px solid var(--rule); margin: 0;
}
.tl li:last-child { border-left-color: transparent; padding-bottom: 0; }
.tl li::before {
  content: ""; position: absolute; left: -5px; top: .42rem;
  width: 9px; height: 9px; background: var(--accent);
  border: 1px solid var(--bg); transform: rotate(45deg);
}
.tl .when {
  display: block; font-family: var(--font-data);
  font-size: .69rem; letter-spacing: .11em; text-transform: uppercase;
  color: var(--accent); margin-bottom: .18rem;
}
.tl .what { display: block; color: var(--ink-2); }

/* ---------------- readings table ---------------- */
.tbl-scroll { overflow-x: auto; margin: 0 0 .9rem; }
table { border-collapse: collapse; width: 100%; font-family: var(--font-data); font-size: .82rem; }
th, td { text-align: left; padding: .48rem .6rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th {
  font-size: .66rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); border-bottom-width: 2px;
}
td.flagged { color: var(--alert); font-weight: 700; }

/* ---------------- misc ---------------- */
.tag {
  display: inline-block; font-family: var(--font-data);
  font-size: .64rem; letter-spacing: .11em; text-transform: uppercase;
  padding: .2rem .5rem; border: 1px solid var(--rule); border-radius: var(--rad);
  color: var(--ink-3); margin: 0 .3rem .3rem 0;
}
.tag.hot { color: var(--alert); border-color: var(--alert); }

.divider {
  height: 1px; border: 0; margin: 1.7rem 0;
  background: linear-gradient(90deg, transparent, var(--rule) 18%, var(--rule) 82%, transparent);
}

.callout {
  border-left: 3px solid var(--accent);
  padding: .2rem 0 .2rem .9rem; margin: 0 0 .95rem;
  color: var(--ink-2); font-style: italic;
}

.doclist { list-style: none; padding: 0; margin: 0; }
.doclist li { border-bottom: 1px solid var(--rule); padding: .65rem 0; margin: 0; }
.doclist a { font-family: var(--font-display); letter-spacing: .02em; }
.doclist .meta { display: block; font-family: var(--font-data); font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-top: .15rem; }
.doclist .missing { color: var(--ink-3); font-style: italic; }

.updated {
  font-family: var(--font-data); font-size: .68rem; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-3);
}

.copybar { display: flex; gap: .5rem; flex-wrap: wrap; margin: .9rem 0 0; }

footer {
  border-top: 1px solid var(--rule); background: var(--bg-2);
  padding: 1.5rem 0; font-size: .88rem; color: var(--ink-3);
  position: relative; z-index: 1;
}
footer p { margin: 0 0 .4rem; }

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--accent); color: var(--accent-ink);
  padding: .6rem 1rem; z-index: 99;
}
.skip:focus { left: .5rem; top: .5rem; }

/* ---------------- private supplement ---------------- */
.nav a.private-link { color: var(--alert); }
.nav a.private-link::before { content: "\2022 "; }
.nav a.private-link[aria-current="page"] { color: var(--alert); border-bottom-color: var(--alert); }

.private-badge {
  font-family: var(--font-data); font-size: .64rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--alert);
  border: 1px solid var(--alert); border-radius: var(--rad);
  padding: .22rem .5rem;
}

/* ==========================================================================
   print.css — printing gives you a clean clinical handover sheet regardless
   of which livery is on screen. Ctrl/Cmd+P, or "Save as PDF".
   ========================================================================== */

@media print {
  @page { margin: 14mm 12mm; }

  html, body {
    background: #fff !important;
    color: #000 !important;
    font-family: "Helvetica Neue", Arial, sans-serif !important;
    font-size: 10.5pt !important;
    line-height: 1.42 !important;
  }
  body::before { display: none !important; }

  .nav, .masthead .mast-tools, footer .no-print, .copybar, .skip { display: none !important; }

  .masthead { border-bottom: 2px solid #000 !important; background: #fff !important; }
  .brand-mark { color: #000 !important; }

  .wrap { max-width: none; padding: 0; }

  .panel {
    background: #fff !important;
    border: 1px solid #666 !important;
    box-shadow: none !important;
    padding: .5rem .7rem !important;
    margin-bottom: .6rem !important;
    break-inside: avoid;
  }
  .panel::before, .panel::after { display: none !important; }
  .panel.alert { border: 2px solid #000 !important; }

  h1 { font-size: 16pt !important; }
  h2 { font-size: 11pt !important; color: #000 !important; }
  h3 { font-size: 10.5pt !important; }
  .lede { font-size: 11pt !important; color: #000 !important; }

  .row { break-inside: avoid; padding: .28rem 0 !important; }
  .row dt, .row .k { color: #000 !important; font-weight: 700; }

  .tl li::before { background: #000 !important; }
  .tl .when { color: #000 !important; font-weight: 700; }
  .tl .what { color: #000 !important; }

  td.flagged { color: #000 !important; text-decoration: underline; }
  .tag { border-color: #000 !important; color: #000 !important; }
  .callout { border-left-color: #000 !important; color: #000 !important; }

  a { color: #000 !important; text-decoration: underline; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 8pt; }
  a[href^="#"]::after { content: ""; }

  .print-only { display: block !important; }
}

.print-only { display: none; }

body { font-family: Georgia, "Times New Roman", serif; }
.warnbar {
  background: var(--alert); color: #fff; padding: .6rem 0;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: .68rem; letter-spacing: .11em; text-transform: uppercase;
  text-align: center; position: relative; z-index: 30;
}
</style>
</head>

"panel", "heading": "Standing treatment recommendation", "blocks": [{"type": "para", "text": "Integrated, consistent psychiatric care, plus trauma-directed psychological treatment — MBT, DBT, CPT, or long-term psychodynamic — with substance-use support alongside it."}, {"type": "para", "text": "This has been the recommendation for some time. It has not been consistently available to me, largely because I have not had a fixed address long enough to hold a place in any service."}]}, {"type": "panel", "kind": "quiet", "heading": "Onset", "blocks": [{"type": "para", "text": "Serious recurring mental illness from late teens to early-mid twenties, with multiple inpatient admissions. The onset overlaps the deaths of my first musical mentor and my grandmother, who was the moral centre of my childhood."}]}]}, "risk": {"eyebrow": "Private supplement", "title": "Risk history", "lede": "Written plainly because a polite version of this page would be useless to you.", "blocks": [{"type": "alert", "heading": "Documented episodes", "blocks": [{"type": "rows", "items": [{"k": "April 2025", "v": "Hospital admission 18–20 April with chest pain, significant social stress, and suicidal ideation. Assessed as a situational crisis. On review I was future-focused with no plan or intent."}, {"k": "April 2025", "v": "Further ED presentation 28–29 April in situational crisis with suicidal ideation. Chest tightness eased as psychological state settled. Reviewed by the mental health team and discharged once mood had settled, with follow-up booked."}, {"k": "December 2025", "v": "Syncope while driving, 17 December 2025. Not a self-harm event — low blood pressure, extreme heat, dehydration, on three antihypertensives, with cannabis use the previous day. Recorded here so it is not misfiled as intentional."}, {"k": "Pattern", "v": "My crises have been situational — triggered by specific events — rather than free-floating. That has been true every time so far. It is not a guarantee about the future and I am not offering it as one."}, {"k": "Current", "v": "TO FILL — update this honestly every time it changes. Present or absent, ideation, plan, intent. If this line is stale it is worse than useless."}]}]}, {"type": "panel", "heading": "What has actually helped", "blocks": [{"type": "list", "items": ["PARC. The four weeks in late April 2025 worked. It is why I am asking for it again.", "Having somewhere to make things. Music, code, writing. When that stops, everything else gets worse quickly.", "Rick and Anna Clissold, and the church community around them.", "Being told the truth about what is happening and when."]}]}, {"type": "panel", "heading": "What makes it worse", "blocks": [{"type": "list", "items": ["Having to re-tell the whole history to a new person. This page exists because of that.", "Being deprioritised because I present articulately.", "Unanswered correspondence and open-ended waiting with no stated timeframe.", "Losing the space to work."]}]}, {"type": "panel", "kind": "quiet", "heading": "Forensic history", "blocks": [{"type": "para", "text": "There is a forensic history — offending between 2017 and 2023 in the context of a marriage breakdown and untreated illness, with periods in custody, and rehabilitation programs completed. I am not hiding it and I will answer questions about it directly."}, {"type": "para", "text": "I have deliberately not itemised it here. It is documented in Dr Winton-Brown's report and in court records, both of which are more accurate than a summary I write about myself. Ask me and I will tell you, or ask for the report."}]}]}}};
var LIVERIES = ["vellum","iron","brass","emerald","sanctum","sigil"];
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=String(x);return n;}
function frag(){return document.createDocumentFragment();}
function $(s){return document.querySelector(s);}
function applyLivery(v){document.documentElement.setAttribute("data-livery",v);
  var ds=document.querySelectorAll(".livery-dot");for(var i=0;i<ds.length;i++){ds[i].setAttribute("aria-pressed",ds[i].dataset.livery===v?"true":"false");}}
function applyClinical(on){document.documentElement.setAttribute("data-clinical",on?"on":"off");
  $("#clinicalBtn").setAttribute("aria-pressed",on?"true":"false");}
function renderBlocks(l){var f=frag();(l||[]).forEach(function(b){var n=renderBlock(b);if(n)f.appendChild(n);});return f;}
function renderBlock(b){
  if(!b||!b.type)return null;
  switch(b.type){
    case "panel": case "alert": {
      var c="panel";if(b.type==="alert")c+=" alert";if(b.kind==="quiet")c+=" quiet";
      var p=el("section",c);if(b.heading)p.appendChild(el("h2",null,b.heading));
      p.appendChild(renderBlocks(b.blocks));return p;}
    case "para": return el("p",null,b.text);
    case "callout": return el("p","callout",b.text);
    case "list": {var u=el("ul");(b.items||[]).forEach(function(t){u.appendChild(el("li",null,t));});return u;}
    case "rows": {var dl=el("dl","rows");(b.items||[]).forEach(function(it){
        var r=el("div","row");r.appendChild(el("dt",null,it.k));
        var dd=el("dd",null,it.v);if(/^TO FILL/.test(String(it.v||"")))dd.style.color="var(--ink-3)";
        r.appendChild(dd);dl.appendChild(r);});return dl;}
    case "timeline": {var ol=el("ol","tl");(b.items||[]).forEach(function(it){
        var li=el("li");li.appendChild(el("span","when",it.when));li.appendChild(el("span","what",it.what));ol.appendChild(li);});return ol;}
    case "table": {var w=el("div","tbl-scroll"),t=el("table"),th=el("thead"),tr=el("tr");
        (b.columns||[]).forEach(function(c){tr.appendChild(el("th",null,c));});th.appendChild(tr);t.appendChild(th);
        var tb=el("tbody");(b.rows||[]).forEach(function(r){var x=el("tr");
          r.forEach(function(cell){var td=el("td",null,cell===""?"\u2014":cell);
            if(/^TO FILL/.test(String(cell||"")))td.style.color="var(--ink-3)";x.appendChild(td);});
          tb.appendChild(x);});t.appendChild(tb);w.appendChild(t);return w;}
    default: return null;
  }
}
function renderPage(id){
  var pg=DATA.pages[id],app=$("#app");app.innerHTML="";
  if(!pg){app.appendChild(el("p",null,"Not found."));return;}
  var h=el("header","page-head");
  if(pg.eyebrow)h.appendChild(el("p","eyebrow",pg.eyebrow));
  h.appendChild(el("h1",null,pg.title));
  if(pg.lede)h.appendChild(el("p","lede",pg.lede));
  app.appendChild(h);app.appendChild(renderBlocks(pg.blocks));
  var ls=document.querySelectorAll(".nav a");
  for(var i=0;i<ls.length;i++){ if(ls[i].dataset.id===id)ls[i].setAttribute("aria-current","page");else ls[i].removeAttribute("aria-current"); }
  window.scrollTo(0,0);
}
(function(){
  var lh=$("#liveries");
  LIVERIES.forEach(function(n){var b=el("button","livery-dot dot-"+n);b.type="button";b.dataset.livery=n;
    b.setAttribute("aria-label",n);b.title=n;b.addEventListener("click",function(){applyLivery(n);});lh.appendChild(b);});
